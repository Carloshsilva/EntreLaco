# Integração contínua da EntreLaço: a cada push e pull request, confere estilo, migrações,
# a configuração do Django, os testes (no PostgreSQL, como em produção) e os arquivos estáticos.
# Também monta a imagem Docker, para a implantação não quebrar sem ninguém ver.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Estilo, migrações e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: entrelaco_ci
          POSTGRES_USER: entrelaco
          POSTGRES_PASSWORD: entrelaco-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entrelaco -d entrelaco_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Valores só para o CI: nenhum é segredo.
      DJANGO_SECRET_KEY: chave-de-teste-do-ci-nao-e-segredo
      DATABASE_URL: postgres://entrelaco:entrelaco-ci@localhost:5432/entrelaco_ci
      ENTRELACO_AMBIENTE_DE_TESTE: "1"

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Preparar o Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar as dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Conferir o estilo (ruff)
        run: ruff check .

      - name: Conferir se falta alguma migração
        run: python manage.py makemigrations --check --dry-run

      - name: Conferir a configuração do Django
        run: python manage.py check

      - name: Rodar os testes no PostgreSQL
        run: python manage.py test --noinput

      - name: Juntar os arquivos estáticos
        run: python manage.py collectstatic --noinput

  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Conferir o docker-compose.yml com o .env de exemplo
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Montar a imagem
        run: docker build --tag entrelaco-web:ci .
